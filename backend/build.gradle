plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.bma'
version = '0.2.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories { mavenCentral() }

def querydslVersion = '5.1.0'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // DB 스키마 버전 관리. 기동 시 classpath:db/migration 의 마이그레이션을 순서대로 적용한다.
    // 스키마 변경은 반드시 새 마이그레이션 파일로만 한다(backend/docs/DB_MIGRATION.md 참고).
    implementation 'org.flywaydb:flyway-core'
    // MySQL 지원은 Flyway 10 부터 별도 모듈로 분리되어 있다. 이게 없으면 기동 시
    // "Unsupported Database: MySQL" 로 실패한다.
    runtimeOnly 'org.flywaydb:flyway-mysql'

    // @ConfigurationProperties 바인딩 메타데이터 생성(IDE 자동완성용)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    implementation "com.querydsl:querydsl-jpa:${querydslVersion}:jakarta"
    annotationProcessor "com.querydsl:querydsl-apt:${querydslVersion}:jakarta"
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'com.mysql:mysql-connector-j'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // DB 없이 저장소/서비스 테스트를 돌리기 위한 인메모리 DB
    testRuntimeOnly 'com.h2database:h2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // -parameters: Spring 이 생성자/메서드 파라미터 이름을 읽을 수 있게 한다
    //              (@ConfigurationProperties 생성자 바인딩, @PathVariable 등에 필요).
    // -Xlint    : 사용하지 않는 import 등 흔한 실수를 경고로 노출한다(빌드를 깨뜨리지는 않는다).
    options.compilerArgs << '-parameters' << '-Xlint:deprecation' << '-Xlint:unchecked'
}

// QueryDSL Q 클래스는 Spring Boot Gradle 플러그인이 기본값으로
// build/generated/sources/annotationProcessor/java/main 에 생성하므로 별도 설정하지 않는다.
// (compileTestJava 까지 같은 디렉터리로 강제하면 중복 생성 문제가 생길 수 있다.)
tasks.named('clean') {
    // Q 클래스는 build/ 아래에 있으므로 clean 만으로 함께 정리된다.
    doLast {
        logger.lifecycle('build 디렉터리를 정리했습니다. 다음 빌드에서 QueryDSL Q 클래스가 재생성됩니다.')
    }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}
